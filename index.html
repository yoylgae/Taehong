<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장관리시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- 왼쪽 사이드바 -->
<aside class="side" id="side">
  <a class="brand" href="#" id="logo">
    <span class="mark">P</span>
    <span class="brand-txt"><b>PMS</b><small>현장관리시스템</small></span>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot">
    <button type="button" class="side-btn" id="btn-settings"><i class="ic">⚙</i><span>현장 설정</span></button>
    <a class="side-btn" href="/__logout" title="접속 비밀번호 다시 묻기"><i class="ic">⎋</i><span>로그아웃</span></a>
    <button type="button" class="side-btn" id="side-tg" title="사이드바 접기"><i class="ic">⟨</i><span>접기</span></button>
  </div>
</aside>

<div class="main">
  <!-- 상단 바 -->
  <header class="topbar">
    <div class="crumb" id="crumb">홈</div>
    <div class="top-r">
      <button type="button" class="pop" id="btn-pop" title="이 화면을 새 창으로 열기" hidden>새 창으로 열기 ↗</button>
      <span class="chip" id="site-label">현장</span>
      <span class="avatar" id="avatar">U</span>
    </div>
  </header>

  <!-- 열린 화면 탭 -->
  <div class="tabstrip" id="tabbar"></div>

  <main class="content" id="content">
    <section class="pane" data-pane="home" id="home">
      <div class="dash">
        <div class="dash-head">
          <div><h1 id="d-hello">안녕하세요</h1><p class="sub" id="d-now"></p></div>
          <a class="btn primary" href="#" data-open="ewp" data-hash="#/new">+ 작업계획서 작성</a>
        </div>

        <div class="kpis">
          <div class="kpi"><span class="k-label">전체 작업계획서</span><b class="k-val" id="k-total">0</b><span class="k-sub">건</span></div>
          <div class="kpi accent"><span class="k-label">결재 대기</span><b class="k-val" id="k-wait">0</b><span class="k-sub">상신 상태</span></div>
          <div class="kpi"><span class="k-label">금일 작업 장비</span><b class="k-val" id="k-today">0</b><span class="k-sub">대</span></div>
          <div class="kpi"><span class="k-label">이번 달 반입</span><b class="k-val" id="k-month">0</b><span class="k-sub">대</span></div>
        </div>

        <div class="grid2">
          <div class="card">
            <div class="card-h"><h3>최근 작업계획서</h3><a href="#" data-open="ewp" class="link">전체 보기 →</a></div>
            <table class="tb"><colgroup><col style="width:90px"><col><col style="width:170px"><col style="width:100px"></colgroup>
              <thead><tr><th>상태</th><th>작업명 · 차량번호</th><th>작업기간</th><th>등록일</th></tr></thead>
              <tbody id="d-recent"></tbody></table>
          </div>
          <div class="col">
            <div class="card">
              <div class="card-h"><h3>공사기간</h3><a href="#" class="link set-link">설정</a></div>
              <div class="term" id="d-term">-</div>
              <div class="prog"><div class="p-done" id="p-done"></div></div>
              <div class="term-row"><span>진행 <b id="d-done">-</b></span><span>남은 기간 <b id="d-left">-</b></span></div>
            </div>
            <div class="card">
              <div class="card-h"><h3>결재 대기</h3><button type="button" class="link" id="d-refresh">새로고침</button></div>
              <ul class="list" id="d-todo"></ul>
            </div>
            <div class="card">
              <div class="card-h"><h3>상태별 현황</h3></div>
              <div class="stat-row">
                <div><small>작성중</small><b id="s-작성중">0</b></div>
                <div><small>상신</small><b id="s-상신">0</b></div>
                <div><small>결재완료</small><b id="s-결재완료">0</b></div>
                <div><small>반려</small><b id="s-반려">0</b></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 현장 설정 -->
<dialog id="dlg-settings">
  <form method="dialog" id="f-settings" autocomplete="off">
    <h3>현장 설정</h3>
    <label><span>현장명</span><input name="site_name" required></label>
    <label><span>현장코드</span><input name="site_code" placeholder="예: GF32"></label>
    <label><span>사용자명</span><input name="user_name" placeholder="메인 화면에 표시할 이름"></label>
    <label><span>공사 시작일</span><input type="date" name="start_date"></label>
    <label><span>공사 종료일</span><input type="date" name="end_date"></label>
    <div class="dlg-btns"><button value="cancel" formnovalidate class="btn">닫기</button><button value="save" class="btn primary">저장</button></div>
  </form>
</dialog>
<div id="toast" hidden></div>
<script type="module" src="shell.js"></script>
</body>
</html>
