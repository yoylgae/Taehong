<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업허가서(PTW)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>작업허가서(PTW)</h1>
  <span class="save" id="save"></span>
  <span class="grow"></span>
  <button type="button" class="btn" id="p-main" title="작업허가서 한 장(갑지)만 인쇄">🖨 갑지 인쇄</button>
  <button type="button" class="btn primary" id="p-all" title="작성한 계획서까지 모두 이어서 인쇄">🖨 통합 인쇄</button>
</header>

<div class="wrap">
  <aside class="days" id="list"></aside>
  <main id="main"><p class="muted pad">불러오는 중…</p></main>
</div>

<dialog id="dlg" class="wide"><form method="dialog" id="dlg-f"></form></dialog>
<datalist id="dl-wt1"></datalist>
<datalist id="dl-wt2"></datalist>
<datalist id="dl-wt3"></datalist>
<datalist id="dl-eq"></datalist>
<datalist id="dl-size"></datalist>
<datalist id="dl-type"></datalist>
<datalist id="dl-names"></datalist>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
