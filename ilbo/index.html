<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업일보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>작업일보</h1>
  <div class="dnav">
    <button type="button" class="ib" id="d-prev" title="전날">‹</button>
    <input type="date" id="d-day">
    <button type="button" class="ib" id="d-next" title="다음날">›</button>
    <button type="button" class="btn sm" id="d-today">오늘</button>
  </div>
  <span class="save" id="save"></span>
  <span class="grow"></span>
  <button type="button" class="btn primary" id="x-day" title="이 날짜 하루치: 공사일보 · 출력일보 · 안전교육일지를 한 파일로">📥 이 날 일보 엑셀</button>
  <button type="button" class="btn" id="x-report" title="첫날부터 이 날짜까지 모든 공사일보를 한 시트에 이어 붙인 통합본">📚 작업일보 통합 엑셀</button>
  <button type="button" class="btn ghost" id="x-tpl" title="엑셀 양식 파일 바꾸기">⚙ 양식</button>
</header>

<div class="wrap">
  <aside class="days" id="days"></aside>
  <main id="main"><p class="muted pad">불러오는 중…</p></main>
</div>

<!-- 엑셀 결과 / 양식 -->
<dialog id="dlg">
  <form method="dialog" id="dlg-f"></form>
</dialog>
<datalist id="dl-weather"><option>맑음</option><option>흐림</option><option>구름많음</option><option>비</option><option>눈</option><option>비 후 갬</option></datalist>
<datalist id="dl-names"></datalist>
<datalist id="dl-jobs"></datalist>
<datalist id="dl-equip"></datalist>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
