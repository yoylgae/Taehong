<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전보건교육 일지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../ptw/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>안전ㆍ보건 교육 훈련 일지</h1>
  <span class="save" id="save"></span>
  <span class="grow"></span>
  <button type="button" class="btn primary" id="print">🖨 인쇄</button>
</header>
<div class="wrap">
  <aside class="days" id="list"></aside>
  <main id="main"><p class="muted pad">불러오는 중…</p></main>
</div>
<dialog id="dlg" class="wide"><form method="dialog" id="dlg-f"></form></dialog>
<datalist id="dl-names"></datalist>
<datalist id="dl-place"><option>현장 사무실 교육장</option><option>현장 TBM 장소</option><option>현장 휴게실</option></datalist>
<input type="file" id="f-ppt" accept=".pptx" hidden>
<input type="file" id="f-photo" accept="image/*" multiple hidden>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
