<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직영실행</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"><p class="muted pad">불러오는 중…</p></main>

<!-- 새 달 만들기 -->
<dialog id="dlg-new">
  <form method="dialog" id="f-new" autocomplete="off">
    <h3>새 달 만들기</h3>
    <label><span>정산 월</span><input type="month" name="ym" required></label>
    <label><span>제목</span><input name="title" placeholder="예: 한남3구역 직영 실행 (10월)"></label>
    <label><span>이전 달에서 가져오기</span><select name="copy"><option value="">가져오지 않음 (빈 양식)</option></select></label>
    <p class="hint">가져오기를 고르면 인건비·식대 명단, 실행내역서 품목·업체·비고, 증빙서류 묶음 이름을 옮겨 옵니다. 출역일·금액은 비워 둡니다.</p>
    <div class="dlg-btns"><button value="cancel" formnovalidate class="btn">닫기</button><button value="ok" class="btn primary">만들기</button></div>
  </form>
</dialog>

<!-- 사진/문서 크게 보기 -->
<dialog id="dlg-view" class="viewer">
  <form method="dialog"><button class="btn sm close" value="x">닫기 ✕</button></form>
  <div id="view-body"></div>
</dialog>

<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
